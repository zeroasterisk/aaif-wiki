name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check aaif_wiki tests

      - name: Test
        run: uv run pytest -q

      # The deterministic gate from ADR-008. No LLM, no network, no credentials --
      # which is exactly why it can run on every PR and block a merge.
      - name: Validate OKF bundle
        run: uv run aaif-wiki validate

  # Scheduled ingestion is intentionally NOT wired up yet: it needs a decision on
  # which identity opens the PRs and a measured cost figure from a real bootstrap.
  # See ADR-009 and ADR-004.

[project]
name = "aaif-wiki"
version = "0.1.0"
description = "Autonomous OKF Knowledge Graph & Wiki Engine for the Agentic AI Foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alan Blount", email = "alan@zeroasterisk.com" }
]
dependencies = [
    "google-adk>=2.5.0",
    "google-genai>=1.0.0",
    "temporalio>=1.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2.1",
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "google-agents-cli>=0.6.0",
]
openviking = [
    "openviking>=0.1.0",
]

[project.scripts]
aaif-wiki = "aaif_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

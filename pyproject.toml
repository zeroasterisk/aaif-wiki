[project]
name = "aaif-wiki"
version = "0.1.0"
description = "Autonomous OKF Knowledge Graph & Wiki Engine for the Agentic AI Foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alan Blount", email = "alan@zeroasterisk.com" }
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Optional durable-orchestration backend. The pipeline runs without this;
# see ADR-002. Activities are Temporal-compatible by construction.
temporal = [
    "temporalio>=1.7.0",
]
# Generic OKF MCP server (bundle-agnostic).
mcp = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
aaif-wiki = "aaif_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aaif_wiki"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # B008: typer's documented API *requires* `typer.Option(...)` in argument
    # defaults. This is a false positive for every typer CLI ever written.
    "B008",
    # UP042: `str, Enum` is deliberate over `StrEnum`. Every enum here crosses the
    # orchestrator's JSON boundary (see orchestration/base.py) and the current form
    # has verified round-trip behaviour under pydantic. Switching is cosmetic and
    # would need that serialization re-verified for no functional gain.
    "UP042",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

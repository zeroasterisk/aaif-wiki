# AAIF Wiki Configuration
# Single source of truth for tunables. ADRs reference these values rather than
# restating literals -- restated literals drift.

project:
  name: "AAIF Knowledge Wiki"
  organization: "aaif"
  bundle_root: "wiki"       # canonical OKF v0.2 bundle (committed)
  event_store: "raw/events" # append-only event log (committed)
  cache_dir: "raw/cache"    # git mirrors + API cache (gitignored, disposable)
  index_db: "raw/index.db"  # derived read model (gitignored, rebuildable)
  dist_dir: "dist"          # build artifacts (gitignored)

curator:
  # Gemini 3.7 Flash, released 2026-08-13. The Flash line is moving on a ~3-week
  # cadence (3.5 -> 3.6 -> 3.7), so this pin is a decision with a review date, not
  # a fossil: revisit quarterly. Pinned rather than aliased so that replay and the
  # `generated.by` provenance refer to the model that actually produced the text.
  model: "gemini-3.7-flash"
  fallback_model: "gemini-flash-latest"
  vertex:
    project: null           # null -> ADC / GOOGLE_CLOUD_PROJECT
    location: "global"
  iteration_budget: 15
  # MUST stay below iteration_budget or the compactor can never fire.
  compaction_threshold: 10
  temperature: 0.2
  # Introductory pricing, USD per 1M tokens. Approximate by design; drives budget.
  usd_per_1m_input: 0.75
  usd_per_1m_output: 3.75

# Optional advisory classifier for typed mutation proposals. The API key is read
# only from JEV_API_KEY. JEV_ENABLED overrides `enabled` for one run.
# Disabled means no request, no credential requirement, and the original
# deterministic validation + human-review pipeline runs unchanged.
jev:
  enabled: false
  endpoint: "https://api.typesafe.ai/v1/systemone"
  model: "jev-latest"
  confidence_threshold: 0.65
  timeout_seconds: 20
  maximum_attempts: 3
  retry_backoff_seconds: 1

# Autonomous semantic-resolution ladder. The deterministic layer always runs.
# Vertex layers use the curator's existing Vertex credentials when implemented;
# unavailable or failing model layers are evidence, never a pipeline blocker.
resolution:
  enabled: true
  layers:
    - "deterministic-context"
    - "vertex-fast"
    - "vertex-deep"
  exception_confidence_threshold: 0.65
  exceptions_dir: "raw/exceptions"

# Hard ceilings. Iteration budgets bound a single batch; these bound the run.
# Breach aborts with partial progress, which is safe because the event store
# makes resumption cheap.
budget:
  max_usd_per_run: 25.0
  max_tokens_per_run: 20000000
  max_concepts_per_run: 100
  hard_usd_ceiling: 200.0

# ADR-002. `local` by default. Switching to `temporal` is a config change, not a
# rewrite, because activities are Temporal-compatible by construction.
orchestrator:
  backend: "local"          # local | temporal
  checkpoint_path: "raw/.checkpoint.json"
  retry_policy:
    initial_interval_seconds: 2
    backoff_coefficient: 2.0
    maximum_interval_seconds: 60
    maximum_attempts: 5
  # Only read when backend == temporal
  host: "localhost:7233"
  namespace: "default"
  task_queue: "aaif-wiki-queue"

sources:
  github:
    org: "aaif"
    # Discover from the org API rather than hardcoding: AAIF is actively adding
    # repos, and silently missing a new working group would defeat the purpose.
    discover_repos: true
    exclude_repos:
      - ".github"
    # Fallback if discovery fails.
    repositories:
      - "wg-security-and-privacy"
      - "wg-observability-and-traceability"
      - "wg-workflows-and-process-integration"
      - "ws-taxonomy-landscape"
      - "wg-governance-risk-and-regulatory"
      - "wg-agentic-commerce"
      - "wg-accuracy-and-reliability"
      - "wg-identity-and-trust"
      - "technical-committee"
      - "foundation"
      - "community-events"
      - "project-proposals"
      - "working-group-proposals"
      - "public-agents"
      - "aaif-landscape"
    doc_extensions:
      - ".md"
      - ".markdown"
      - ".yaml"
      - ".yml"
    # We need what landed AND what is in flight; WGs do not all work the same way.
    # Anything not merged yields status: draft.
    include_open_prs: true
    include_issues: true
    include_discussions: true
    max_items_per_repo: 25

# ADR-009. The curator never writes to main.
publish:
  enabled: true
  branch_prefix: "wiki/update"
  auto_merge: true          # merge automatically after deterministic CI passes
  base_branch: "main"
  review_records: "raw/reviews"

exporters:
  gist:
    enabled: false          # only human-reviewed concepts are ever published
    public: true
  visualizer:
    enabled: true
    output_dir: "dist"      # NOT wiki/ -- build artifacts stay out of the bundle
  openviking_enabled: false # ADR-006: considered, not adopted

# ADR-007 outbound half. Inbound half lives in curator prompt fencing.
trust:
  link_allowlist:
    - "github.com"
    - "raw.githubusercontent.com"
    - "aaif.io"
    - "www.aaif.io"
    - "linuxfoundation.org"
    - "www.linuxfoundation.org"
    - "eclipse.dev"
    - "wireshark.org"
    - "kernel.org"
  forbidden_patterns:
    - "/google/(bin|src)/"
    - "\\bgoogle3\\b"
    - "file:///"
    - "\\b[A-Za-z0-9._%+-]+@google\\.com\\b"

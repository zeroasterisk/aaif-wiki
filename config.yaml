# AAIF Wiki Configuration
# Single source of truth for tunables. ADRs reference these values rather than
# restating literals -- restated literals drift.

project:
  name: "AAIF Knowledge Wiki"
  organization: "aaif"
  bundle_root: "wiki"       # canonical OKF v0.2 bundle (committed)
  event_store: "raw/events" # append-only event log (committed)
  cache_dir: "raw/cache"    # git mirrors + API cache (gitignored, disposable)
  index_db: "raw/index.db"  # derived read model (gitignored, rebuildable)
  dist_dir: "dist"          # build artifacts (gitignored)

curator:
  # Gemini 3.8 Flash (upgraded 2026-10-12 from 3.7). The Flash line is moving on a ~3-week
  # cadence (3.5 -> 3.6 -> 3.7 -> 3.8), so this pin is a decision with a review date, not
  # a fossil: revisit quarterly. Pinned rather than aliased so that replay and the
  # `generated.by` provenance refer to the model that actually produced the text.
  model: "gemini-3.8-flash"
  fallback_model: "gemini-flash-latest"
  vertex:
    project: null           # null -> ADC / GOOGLE_CLOUD_PROJECT
    location: "global"
  iteration_budget: 15
  # MUST stay below iteration_budget or the compactor can never fire.
  compaction_threshold: 10
  temperature: 0.2
  # Introductory pricing, USD per 1M tokens. Approximate by design; drives budget.
  usd_per_1m_input: 0.75
  usd_per_1m_output: 3.75

# Optional advisory classifier for typed mutation proposals. The API key is read
# only from JEV_API_KEY. JEV_ENABLED overrides `enabled` for one run.
# Disabled means no request, no credential requirement, and the original
# deterministic validation + human-review pipeline runs unchanged.
jev:
  enabled: false
  endpoint: "https://api.typesafe.ai/v1/systemone"
  model: "jev-latest"
  confidence_threshold: 0.65
  timeout_seconds: 20
  maximum_attempts: 3
  retry_backoff_seconds: 1

# Autonomous semantic-resolution ladder. The deterministic layer always runs.
# Vertex layers use the curator's existing Vertex credentials when implemented;
# unavailable or failing model layers are evidence, never a pipeline blocker.
resolution:
  enabled: true
  layers:
    - "deterministic-context"
    - "vertex-fast"
    - "vertex-deep"
  exception_confidence_threshold: 0.65
  exceptions_dir: "raw/exceptions"

# Hard ceilings. Iteration budgets bound a single batch; these bound the run.
# Breach aborts with partial progress, which is safe because the event store
# makes resumption cheap.
budget:
  max_usd_per_run: 25.0
  max_tokens_per_run: 20000000
  max_concepts_per_run: 100
  hard_usd_ceiling: 200.0

# ADR-002. `local` by default. Switching to `temporal` is a config change, not a
# rewrite, because activities are Temporal-compatible by construction.
orchestrator:
  backend: "local"          # local | temporal
  checkpoint_path: "raw/.checkpoint.json"
  retry_policy:
    initial_interval_seconds: 2
    backoff_coefficient: 2.0
    maximum_interval_seconds: 60
    maximum_attempts: 5
  # Only read when backend == temporal
  host: "localhost:7233"
  namespace: "default"
  task_queue: "aaif-wiki-queue"

sources:
  github:
    org: "aaif"
    # Discover from the org API rather than hardcoding: AAIF is actively adding
    # repos, and silently missing a new working group would defeat the purpose.
    discover_repos: true
    exclude_repos:
      - ".github"
    # Fallback if discovery fails.
    repositories:
      - "wg-security-and-privacy"
      - "wg-observability-and-traceability"
      - "wg-workflows-and-process-integration"
      - "ws-taxonomy-landscape"
      - "wg-governance-risk-and-regulatory"
      - "wg-agentic-commerce"
      - "wg-accuracy-and-reliability"
      - "wg-identity-and-trust"
      - "technical-committee"
      - "foundation"
      - "community-events"
      - "project-proposals"
      - "working-group-proposals"
      - "public-agents"
      - "aaif-landscape"
    doc_extensions:
      - ".md"
      - ".markdown"
      - ".yaml"
      - ".yml"
    # We need what landed AND what is in flight; WGs do not all work the same way.
    # Anything not merged yields status: draft.
    include_open_prs: true
    include_issues: true
    include_discussions: true
    max_items_per_repo: 25

    # ADR-013. Non-AAIF repositories on the same topics, as an explicit allowlist
    # (never discovered). `steward` is who governs the work and is what the curator
    # must attribute it to. Files only by default; include_paths keeps CLAs,
    # examples and changelogs out.
    external:
      - repo: "frmoretto/agentic-standards-map"
        # Independent CC BY 4.0 dataset; the author discloses participating in venues it maps.
        steward: "Francesco Marinoni Moretto (independent researcher)"
        topics: ["landscape", "governance", "commerce", "discovery", "identity"]
        include_paths: ["README.md", "METHOD.md", "MAP.md", "notes/seams.md", "entries"]
        doc_extensions: [".md", ".yaml"]   # entries/*.yaml ARE the map's content
        file_limit: 70
      - repo: "google-agentic-commerce/AP2"
        steward: "FIDO Alliance"
        topics: ["payments", "commerce"]
        include_paths: ["README.md", "docs"]
        file_limit: 15
      - repo: "Universal-Commerce-Protocol/ucp"
        # Universal-Commerce-Protocol/.github GOVERNANCE.md + MAINTAINERS.md
        steward: "the UCP Governing Council (Domain Tech Councils staffed mainly by Google and Shopify)"
        topics: ["commerce", "discovery"]
        include_paths: ["README.md", "docs/specification/overview", "docs/specification/shopping/checkout",
                        "docs/specification/shopping/cart", "docs/specification/shopping/catalog",
                        "docs/specification/payment/guide.md", "docs/specification/payment/extensions/ap2-mandates.md",
                        "docs/documentation/core-concepts.md", "docs/documentation/ucp-and-ap2.md",
                        "docs/specification"]
        file_limit: 40
      - repo: "agentic-commerce-protocol/agentic-commerce-protocol"
        # README: "jointly governed by OpenAI and Stripe as Founding Maintainers"
        steward: "OpenAI and Stripe (Founding Maintainers)"
        topics: ["commerce", "payments"]
        include_paths: ["README.md", "MAINTAINERS.md", "docs", "rfcs"]
        file_limit: 25
      - repo: "x402-foundation/x402"   # canonical; coinbase/x402 is now a fork of it
        steward: "x402 Foundation (Linux Foundation)"
        topics: ["payments"]
        include_paths: ["README.md", "specs/x402-specification-v2.md", "specs/transports-v2",
                        "specs/schemes/exact/scheme_exact.md", "specs/schemes/exact/scheme_exact_evm.md",
                        "specs/schemes/upto/scheme_upto.md", "specs/schemes/auth-capture/scheme_auth_capture.md",
                        "specs/schemes/batch-settlement/scheme_batch_settlement.md", "specs/README.md",
                        "specs/x402-specification-v1.md", "specs/extensions"]
        file_limit: 25
      - repo: "i-am-bee/acp"   # archived; cited only to disambiguate "ACP"
        # README: "ACP is now part of A2A under the Linux Foundation" (2025-08-25)
        steward: "IBM Research (BeeAI); archived, merged into A2A"
        topics: ["communication"]
        include_paths: ["README.md"]
        file_limit: 1
      - repo: "Agent-Card/ai-catalog"
        # README: temporary working repo maintained by the LF; GOVERNANCE.md: TSC
        # seats nominated by MCP core maintainers (2) and the A2A TSC (2).
        steward: "the Linux Foundation (temporary pre-v1 repo; TSC nominated by MCP and A2A maintainers)"
        topics: ["discovery"]
        include_paths: ["README.md", "GOVERNANCE.md", "specification", "docs/specification.md", "docs"]
        file_limit: 20

# ADR-009. The curator never writes to main.
publish:
  enabled: true
  branch_prefix: "wiki/update"
  auto_merge: true          # merge automatically after deterministic CI passes
  base_branch: "main"
  review_records: "raw/reviews"

exporters:
  gist:
    enabled: false          # only human-reviewed concepts are ever published
    public: true
  visualizer:
    enabled: true
    output_dir: "dist"      # NOT wiki/ -- build artifacts stay out of the bundle
  openviking_enabled: false # ADR-006: considered, not adopted

# ADR-007 outbound half. Inbound half lives in curator prompt fencing.
trust:
  link_allowlist:
    - "github.com"
    - "raw.githubusercontent.com"
    - "aaif.io"
    - "www.aaif.io"
    - "linuxfoundation.org"
    - "www.linuxfoundation.org"
    - "eclipse.dev"
    - "wireshark.org"
    - "kernel.org"
    - "oceanbase.io"
    - "spdx.github.io"
    - "posthog.com"
    - "amd.com"
    - "github.ai"
  forbidden_patterns:
    - "/google/(bin|src)/"
    - "\\bgoogle3\\b"
    - "file:///"
    - "\\b[A-Za-z0-9._%+-]+@google\\.com\\b"
